name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The platform packages run with --max-warnings 0 (SPEC §13): a warning
      # nobody fixes is a warning nobody reads. The pre-existing marketing app
      # keeps its own Next.js config and currently emits one known warning
      # (CDN-loaded fonts, logged in docs/current-architecture.md §4).
      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

  # Wired now, filled in Phase 2. Keeping the stages present means adding the
  # ledger invariant suite is a one-line change rather than a CI redesign.
  integration:
    runs-on: ubuntu-latest
    needs: verify
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: garm_test
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ['5432:5432']
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Integration tests
        run: echo "No integration suite yet — arrives with the ledger in Phase 2."
      - name: Ledger invariants
        run: echo "No ledger yet — invariant suite arrives in Phase 2 (SPEC §37)."
