# Local development services. SPEC §7.
# Nothing here is production configuration; credentials are deliberately trivial
# and this file must never be the basis for a deployed environment.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: garm
      POSTGRES_PASSWORD: garm_local_dev
      POSTGRES_DB: garm
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U garm']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  redis-data:
